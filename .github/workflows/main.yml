name: CampusLab CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Docker Compose Configuration
        run: |
          if [ -f docker-compose.yml ]; then docker compose config -q; fi

      - name: Install & Validate Backend (Node/Express)
        working-directory: ./server
        run: |
          npm install
          if [ -f src/index.js ]; then node --check src/index.js; fi

      - name: Install & Build Frontend (React/Vite)
        working-directory: ./client
        run: |
          npm install
          npm run build
