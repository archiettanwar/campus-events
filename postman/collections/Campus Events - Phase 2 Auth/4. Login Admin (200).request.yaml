$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "admin@campus.edu",
      "password": "Admin@1234"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.token) pm.collectionVariables.set('adminToken', res.token);
    language: text/javascript
order: 4000
