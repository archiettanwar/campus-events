$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Alex Student",
      "email": "alex@campus.edu",
      "password": "Password1"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.token) pm.collectionVariables.set('studentToken', res.token);
    language: text/javascript
order: 1000
