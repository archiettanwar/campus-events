services:
  mongo:
    image: mongo:7
    container_name: campus-events-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: campus-events-server
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/campus_events
      JWT_SECRET: campus_events_docker_secret_key_change_in_prod
      JWT_EXPIRES_IN: 1d
      CLIENT_URL: http://localhost:3000
      ADMIN_EMAIL: admin@campus.edu
      ADMIN_PASSWORD: Admin@1234

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_SOCKET_URL: http://localhost:5000
    container_name: campus-events-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:80"

volumes:
  mongo_data: